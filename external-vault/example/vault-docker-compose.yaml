version: '3.6'

services:
  vault:
    image: hashicorp/vault
    container_name: vault
    restart: on-failure:10
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: 'http://0.0.0.0:8200'
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/file
      - ./config:/vault/config
    entrypoint: vault server -config=/vault/config/vault.hcl

volumes:
  vault-data:
